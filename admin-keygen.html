<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Keygen – Blechkalkulator Pro</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090d16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            brand: {
              50: '#ecfeff',
              500: '#06b6d4',
              600: '#0891b2',
              900: '#164e63'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090d16;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .glow-cyan {
      box-shadow: 0 0 35px -5px rgba(6, 182, 212, 0.25);
    }
    .glow-emerald {
      box-shadow: 0 0 35px -5px rgba(16, 185, 129, 0.3);
    }
    .pin-input {
      letter-spacing: 0.5em;
      text-align: center;
      -webkit-text-security: disc;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans select-none">

  <!-- ================= PIN LOCK SCREEN ================= -->
  <div id="pin-screen" class="w-full max-w-sm">
    <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-2xl text-center glow-cyan relative overflow-hidden">
      <!-- Glow Decor -->
      <div class="absolute -top-12 -left-12 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl"></div>
      <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>

      <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 flex items-center justify-center mx-auto mb-5 text-2xl shadow-inner">
        <i class="fa-solid fa-lock"></i>
      </div>

      <h1 class="text-xl font-bold text-white mb-1">Admin-Zugang</h1>
      <p class="text-xs text-slate-400 mb-6">Bitte 4-stelligen Sicherheits-PIN eingeben</p>

      <form id="pin-form" onsubmit="event.preventDefault(); checkPin();" class="space-y-4">
        <div class="relative">
          <input type="password" id="pin-input" inputmode="numeric" maxlength="4" pattern="[0-9]*" autofocus
            placeholder="••••"
            class="pin-input w-full bg-slate-950/80 border-2 border-slate-700 focus:border-cyan-400 rounded-2xl py-3.5 text-2xl text-white outline-none transition-all duration-200">
        </div>

        <button type="submit"
          class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-2xl shadow-lg shadow-cyan-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
          <span>Entsperren</span>
        </button>
      </form>

      <p id="pin-error" class="text-xs text-rose-400 font-medium mt-3 hidden flex items-center justify-center gap-1">
        <i class="fa-solid fa-circle-exclamation"></i> Falscher PIN!
      </p>
    </div>
  </div>


  <!-- ================= KEYGEN MAIN APP ================= -->
  <div id="keygen-app" class="w-full max-w-lg hidden">
    <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 sm:p-7 shadow-2xl backdrop-blur-2xl relative overflow-hidden">
      
      <!-- Top Bar -->
      <div class="flex items-center justify-between border-b border-slate-800/80 pb-4 mb-5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 flex items-center justify-center text-lg">
            <i class="fa-solid fa-key"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-white leading-tight">Keygen Mobile</h2>
            <p class="text-[11px] text-slate-400">Blechkalkulator Pro Admin</p>
          </div>
        </div>
        <button onclick="lockApp()" title="Abmelden"
          class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 flex items-center gap-1.5 transition-colors">
          <i class="fa-solid fa-lock text-[10px]"></i>
          <span>Sperren</span>
        </button>
      </div>

      <!-- Form Inputs -->
      <div class="space-y-4">
        
        <!-- HWID Field -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center justify-between">
            <span>1. Kunden Hardware-ID (HWID)</span>
            <span class="text-[10px] text-slate-500 font-mono">Format: BK-XXXX-XXXX-XXXX</span>
          </label>
          <div class="relative">
            <input type="text" id="hwid-input" placeholder="z. B. BK-8F3A-49C2-E1B9"
              class="w-full bg-slate-950/90 border border-slate-700 focus:border-cyan-400 rounded-xl px-3.5 py-3 text-sm font-mono font-bold text-white placeholder-slate-600 outline-none uppercase tracking-wider transition-all">
            <button onclick="pasteHwid()" type="button"
              class="absolute right-2 top-1/2 -translate-y-1/2 px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-[11px] text-cyan-400 rounded-lg border border-slate-700 font-sans">
              <i class="fa-regular fa-paste mr-1"></i>Einfügen
            </button>
          </div>
        </div>

        <!-- License Type Selection -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">2. Lizenz-Typ</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btn-type-lifetime" onclick="setType('LIFETIME')"
              class="py-2.5 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition-all bg-cyan-500/10 border-cyan-500 text-cyan-300 shadow-sm">
              <i class="fa-solid fa-infinity text-xs"></i> Lifetime (Vollversion)
            </button>
            <button type="button" id="btn-type-1year" onclick="setType('1YEAR')"
              class="py-2.5 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition-all bg-slate-950 border-slate-800 text-slate-400 hover:text-white">
              <i class="fa-regular fa-calendar-check text-xs"></i> 1-Jahres-Lizenz
            </button>
          </div>
        </div>

        <!-- Year Input (Only visible when 1YEAR is selected) -->
        <div id="year-container" class="hidden">
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Gültigkeitsjahr</label>
          <input type="number" id="year-input"
            class="w-full bg-slate-950/90 border border-slate-700 focus:border-cyan-400 rounded-xl px-3.5 py-2.5 text-sm font-mono text-white outline-none">
        </div>

        <!-- Generate Button -->
        <button onclick="generateKey()"
          class="w-full py-3.5 bg-gradient-to-r from-cyan-500 via-cyan-600 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-2xl shadow-lg shadow-cyan-500/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2">
          <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
          <span>Lizenzschlüssel berechnen</span>
        </button>

      </div>

      <!-- Result Card -->
      <div id="result-box" class="mt-6 pt-5 border-t border-slate-800 hidden">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5 mb-2">
          <i class="fa-solid fa-circle-check text-xs"></i> Schlüssel erfolgreich erzeugt
        </span>

        <div class="bg-slate-950 border-2 border-emerald-500/40 rounded-2xl p-3.5 glow-emerald text-center relative mb-3">
          <div id="key-output" class="text-base sm:text-lg font-mono font-bold text-white select-all break-all tracking-wider py-1">
            BKPRO-XXXX-XXXX-XXXX-XXXX
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-3 gap-2">
          <button onclick="copyKey()" id="copy-btn"
            class="py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 shadow-md active:scale-95 transition-all">
            <i class="fa-regular fa-copy"></i>
            <span id="copy-text">Kopieren</span>
          </button>
          <button onclick="shareWhatsApp()"
            class="py-2.5 px-3 bg-emerald-700/80 hover:bg-emerald-600 text-white text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 border border-emerald-500/30 active:scale-95 transition-all">
            <i class="fa-brands fa-whatsapp text-sm"></i>
            <span>WhatsApp</span>
          </button>
          <button onclick="shareEmail()"
            class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 border border-slate-700 active:scale-95 transition-all">
            <i class="fa-regular fa-envelope"></i>
            <span>E-Mail</span>
          </button>
        </div>
      </div>

      <!-- History Section -->
      <div class="mt-6 pt-4 border-t border-slate-800/80">
        <button onclick="toggleHistory()" class="w-full flex items-center justify-between text-xs text-slate-400 hover:text-slate-200">
          <span class="font-medium"><i class="fa-solid fa-clock-rotate-left mr-1.5"></i>Zuletzt erstellte Schlüssel</span>
          <i id="hist-chevron" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
        </button>
        <div id="history-list" class="mt-3 space-y-2 hidden max-h-40 overflow-y-auto pr-1 text-xs">
          <!-- Populated via JS -->
        </div>
      </div>

    </div>
  </div>


  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-full text-xs shadow-2xl flex items-center gap-2 pointer-events-none opacity-0 transition-opacity duration-300 z-50">
    <i class="fa-solid fa-check text-emerald-400"></i>
    <span id="toast-msg">In Zwischenablage kopiert!</span>
  </div>


  <!-- ================= PURE JAVASCRIPT HMAC-SHA256 & LOGIC ================= -->
  <script>
    const CORRECT_PIN = "9696";
    const MASTER_SALT = "Blechkalkulator_Pro_OMAX_Secure_Salt_2026_x89f!#";
    let currentType = "LIFETIME";

    // Initialize Year Input
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("year-input").value = new Date().getFullYear();
      if (sessionStorage.getItem("bk_admin_auth") === "true") {
        showApp();
      }
    });

    // PIN Check
    function checkPin() {
      const input = document.getElementById("pin-input");
      const err = document.getElementById("pin-error");
      const card = document.querySelector("#pin-screen > div");

      if (input.value === CORRECT_PIN) {
        sessionStorage.setItem("bk_admin_auth", "true");
        err.classList.add("hidden");
        showApp();
      } else {
        err.classList.remove("hidden");
        card.classList.add("shake");
        input.value = "";
        setTimeout(() => card.classList.remove("shake"), 400);
      }
    }

    function showApp() {
      document.getElementById("pin-screen").classList.add("hidden");
      document.getElementById("keygen-app").classList.remove("hidden");
      loadHistory();
      setTimeout(() => document.getElementById("hwid-input").focus(), 100);
    }

    function lockApp() {
      sessionStorage.removeItem("bk_admin_auth");
      document.getElementById("pin-input").value = "";
      document.getElementById("keygen-app").classList.add("hidden");
      document.getElementById("pin-screen").classList.remove("hidden");
      document.getElementById("pin-error").classList.add("hidden");
    }

    // Toggle Type
    function setType(type) {
      currentType = type;
      const btnLife = document.getElementById("btn-type-lifetime");
      const btn1Yr = document.getElementById("btn-type-1year");
      const yearCont = document.getElementById("year-container");

      if (type === "LIFETIME") {
        btnLife.className = "py-2.5 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition-all bg-cyan-500/10 border-cyan-500 text-cyan-300 shadow-sm";
        btn1Yr.className = "py-2.5 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition-all bg-slate-950 border-slate-800 text-slate-400 hover:text-white";
        yearCont.classList.add("hidden");
      } else {
        btn1Yr.className = "py-2.5 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition-all bg-cyan-500/10 border-cyan-500 text-cyan-300 shadow-sm";
        btnLife.className = "py-2.5 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition-all bg-slate-950 border-slate-800 text-slate-400 hover:text-white";
        yearCont.classList.remove("hidden");
      }
    }

    // Standalone Pure JS HMAC-SHA256 Implementation (100% Offline Compatible)
    function hmacSHA256(keyStr, msgStr) {
      function sha256(ascii) {
        function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
        var mathPow = Math.pow;
        var maxWord = mathPow(2, 32);
        var lengthProperty = 'length';
        var i, j;
        var result = '';
        var words = [];
        var asciiBitLength = ascii[lengthProperty] * 8;
        var hash = sha256.h = sha256.h || [];
        var k = sha256.k = sha256.k || [];
        var primeCounter = k[lengthProperty];
        var isComposite = {};
        for (var candidate = 2; primeCounter < 64; candidate++) {
          if (!isComposite[candidate]) {
            for (i = 0; i < 300; i += candidate) { isComposite[i] = candidate; }
            hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
            k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
          }
        }
        ascii += '\x80';
        while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
        for (i = 0; i < ascii[lengthProperty]; i++) {
          j = ascii.charCodeAt(i);
          if (j >> 8) return;
          words[i >> 2] |= j << ((3 - i) % 4) * 8;
        }
        words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
        words[words[lengthProperty]] = (asciiBitLength);
        for (j = 0; j < words[lengthProperty];) {
          var w = words.slice(j, j += 16);
          var oldHash = hash;
          hash = hash.slice(0, 8);
          for (i = 0; i < 64; i++) {
            var i2 = i + j;
            var w15 = w[i - 15], w2 = w[i - 2];
            var a = hash[0], e = hash[4];
            var temp1 = hash[7]
              + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
              + ((e & hash[5]) ^ ((~e) & hash[6]))
              + k[i]
              + (w[i] = (i < 16) ? w[i] : (
                w[i - 16]
                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                + w[i - 7]
                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
              ) | 0
              );
            var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
              + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
            hash = [(temp1 + temp2) | 0].concat(hash);
            hash[4] = (hash[4] + temp1) | 0;
          }
          for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
        }
        for (i = 0; i < 8; i++) {
          for (j = 3; j >= 0; j--) {
            var b = (hash[i] >> (8 * j)) & 255;
            result += (b < 16 ? '0' : '') + b.toString(16);
          }
        }
        return result;
      }

      function hexToBin(hex) {
        var str = '';
        for (var i = 0; i < hex.length; i += 2) str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
        return str;
      }

      var blockSize = 64;
      if (keyStr.length > blockSize) keyStr = hexToBin(sha256(keyStr));
      while (keyStr.length < blockSize) keyStr += '\x00';

      var oPad = '', iPad = '';
      for (var i = 0; i < blockSize; i++) {
        oPad += String.fromCharCode(keyStr.charCodeAt(i) ^ 0x5c);
        iPad += String.fromCharCode(keyStr.charCodeAt(i) ^ 0x36);
      }
      return sha256(oPad + hexToBin(sha256(iPad + msgStr)));
    }

    // Key Generation
    function generateKey() {
      const hwidRaw = document.getElementById("hwid-input").value.trim().toUpperCase();
      if (!hwidRaw) {
        showToast("Bitte Kunden Hardware-ID eingeben!");
        document.getElementById("hwid-input").focus();
        return;
      }

      let generatedKey = "";
      if (currentType === "LIFETIME") {
        const msg = hwidRaw + ":LIFETIME";
        const sig = hmacSHA256(MASTER_SALT, msg).toUpperCase();
        generatedKey = `BKPRO-${sig.slice(0,4)}-${sig.slice(4,8)}-${sig.slice(8,12)}-${sig.slice(12,16)}`;
      } else {
        const yearVal = parseInt(document.getElementById("year-input").value) || new Date().getFullYear();
        const msg = `${hwidRaw}:1YEAR:${yearVal}`;
        const sig = hmacSHA256(MASTER_SALT, msg).toUpperCase();
        generatedKey = `BK1YR-${yearVal}-${sig.slice(0,4)}-${sig.slice(4,8)}-${sig.slice(8,12)}`;
      }

      document.getElementById("key-output").innerText = generatedKey;
      document.getElementById("result-box").classList.remove("hidden");
      saveToHistory(hwidRaw, currentType, generatedKey);
      showToast("Schlüssel generiert!");
    }

    // Copy to Clipboard
    async function copyKey() {
      const key = document.getElementById("key-output").innerText.trim();
      try {
        await navigator.clipboard.writeText(key);
      } catch (e) {
        const t = document.createElement("textarea");
        t.value = key;
        document.body.appendChild(t);
        t.select();
        document.execCommand("copy");
        document.body.removeChild(t);
      }
      const copyText = document.getElementById("copy-text");
      copyText.innerText = "Kopiert!";
      showToast("Lizenzschlüssel kopiert!");
      setTimeout(() => copyText.innerText = "Kopieren", 2000);
    }

    // Paste HWID
    async function pasteHwid() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById("hwid-input").value = text.trim().toUpperCase();
          showToast("HWID eingefügt!");
        }
      } catch (err) {
        document.getElementById("hwid-input").focus();
      }
    }

    // Share via WhatsApp
    function shareWhatsApp() {
      const key = document.getElementById("key-output").innerText.trim();
      const hwid = document.getElementById("hwid-input").value.trim().toUpperCase();
      const text = `Hallo! Hier ist Ihr persönlicher Lizenzschlüssel für Blechkalkulator Pro:\n\nHardware-ID: ${hwid}\nLizenzschlüssel: ${key}\n\nVielen Dank für Ihr Vertrauen!`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, "_blank");
    }

    // Share via Email
    function shareEmail() {
      const key = document.getElementById("key-output").innerText.trim();
      const hwid = document.getElementById("hwid-input").value.trim().toUpperCase();
      const subject = "Ihr Lizenzschlüssel für Blechkalkulator Pro";
      const body = `Hallo,\n\nvielen Dank für Ihren Erwerb von Blechkalkulator Pro!\n\nIhre registrierte Hardware-ID:\n${hwid}\n\nIhr persönlicher Lizenzschlüssel:\n${key}\n\nÖffnen Sie einfach Blechkalkulator Pro und geben Sie den Schlüssel unter 'Lizenzschlüssel eingeben' ein.\n\nMit freundlichen Grüßen\nCedric Müllers\ninfo@blechkalkulator.de`;
      window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    // History Storage
    function saveToHistory(hwid, type, key) {
      let hist = JSON.parse(localStorage.getItem("bk_keygen_history") || "[]");
      hist.unshift({
        hwid: hwid,
        type: type,
        key: key,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' })
      });
      if (hist.length > 10) hist = hist.slice(0, 10);
      localStorage.setItem("bk_keygen_history", JSON.stringify(hist));
      loadHistory();
    }

    function loadHistory() {
      const hist = JSON.parse(localStorage.getItem("bk_keygen_history") || "[]");
      const list = document.getElementById("history-list");
      if (hist.length === 0) {
        list.innerHTML = `<p class="text-slate-600 text-center py-2 italic">Noch keine Schlüssel generiert</p>`;
        return;
      }
      list.innerHTML = hist.map(item => `
        <div class="bg-slate-950/70 p-2 rounded-xl border border-slate-800 flex items-center justify-between">
          <div class="truncate mr-2">
            <span class="font-mono font-bold text-slate-200">${item.key}</span>
            <div class="text-[10px] text-slate-500">${item.hwid} • ${item.type} • ${item.time}</div>
          </div>
          <button onclick="navigator.clipboard.writeText('${item.key}'); showToast('Kopiert!');" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-lg text-[10px]">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
      `).join('');
    }

    function toggleHistory() {
      const list = document.getElementById("history-list");
      const chev = document.getElementById("hist-chevron");
      list.classList.toggle("hidden");
      chev.classList.toggle("rotate-180");
    }

    // Toast
    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-msg").innerText = msg;
      toast.classList.remove("opacity-0");
      setTimeout(() => toast.classList.add("opacity-0"), 2500);
    }
  </script>
</body>
</html>
