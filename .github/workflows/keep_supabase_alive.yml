name: Keep Supabase Active

on:
  schedule:
    - cron: '0 10 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          SUB="gqmarabspmnadhamxjxi"
          DOM="supabase.co"
          API="/rest/v1/app_updates"
          Q="select=id&limit=1"
          URL="https://${SUB}.${DOM}${API}?${Q}"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxbWFyYWJzcG1uYWRoYW14anhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTI3NzYsImV4cCI6MjEwMjY4ODc3Nn0.AmmHmcaD47gNFXeoUnw83xgzJuQlrpjn3U_rQUINwJ4"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          
          echo "Supabase Response Code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✓ Supabase successfully pinged! Project remains active."
          else
            echo "Status Code: $STATUS"
            exit 1
          fi
